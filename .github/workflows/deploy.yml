name: Deploy

# main に入ったら Firebase に公開する。Actions 画面の「Run workflow」からも手で実行できる
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: giburu-178f1
  # プロジェクト番号（scripts/setup-cloud.sh の最後にも表示される）
  PROJECT_NUMBER: "667591131197"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm run build
        working-directory: web
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
      - name: Deploy to Firebase
        run: |
          # 初回は権限の反映待ちで失敗することがあるので1回だけやり直す
          npx --yes firebase-tools@15 deploy --project "$PROJECT_ID" --non-interactive --force \
            || (sleep 60 && npx --yes firebase-tools@15 deploy --project "$PROJECT_ID" --non-interactive --force)
      - uses: google-github-actions/setup-gcloud@v2
      - name: Allow the app to call the functions
        run: |
          # アプリや相手用ページから関数を呼べるようにする（ログインや合言葉の確認は関数の中でしている）。
          # firebase deploy がこの設定をできなかった場合に備えて毎回付け直す（2026-10-07 シンプーさん了承）
          for s in $(gcloud run services list --project "$PROJECT_ID" --region asia-northeast1 --format='value(metadata.name)'); do
            gcloud run services add-iam-policy-binding "$s" --project "$PROJECT_ID" --region asia-northeast1 \
              --member=allUsers --role=roles/run.invoker --quiet >/dev/null 2> err.txt \
              && echo "::notice::ok $s" || echo "::warning::$s: $(tr "\n" " " < err.txt | tail -c 600)"
          done
